<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRYPTOMINER v0.4.2</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #00ff41; --green-dim: #00aa2a; --green-faint: #003d0f;
      --green-glow: rgba(0,255,65,0.15); --bg: #050a05; --surface: #080e08;
      --surface2: #0d160d; --border: rgba(0,255,65,0.2); --border-bright: rgba(0,255,65,0.5);
      --red: #ff3333; --yellow: #ffcc00; --blue: #00ccff;
      --text: #00ff41; --text-dim: #00aa2a; --text-faint: #005515;
    }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace; font-size: 13px; overflow-x: hidden; cursor: crosshair; }
    body::before { content: ''; position: fixed; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); pointer-events: none; z-index: 1000; }
    body::after { content: ''; position: fixed; inset: 0; background: rgba(0,255,65,0.012); pointer-events: none; z-index: 999; animation: flicker 8s infinite; }
    @keyframes flicker { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:0.85} 94%{opacity:1} 96%{opacity:0.9} 97%{opacity:1} }

    .shell { max-width: 1100px; margin: 0 auto; padding: 1rem; display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; gap: 1rem; }

    .header { border: 1px solid var(--border-bright); padding: 0.75rem 1.25rem; display: flex; justify-content: space-between; align-items: center; background: var(--surface); box-shadow: 0 0 20px var(--green-glow), inset 0 0 20px rgba(0,255,65,0.03); }
    .logo { font-family: 'VT323', monospace; font-size: 28px; letter-spacing: 3px; text-shadow: 0 0 10px var(--green); }
    .logo span { color: var(--yellow); text-shadow: 0 0 10px var(--yellow); }
    .header-stats { display: flex; gap: 2rem; font-size: 11px; color: var(--text-dim); }
    .header-stats strong { color: var(--green); font-size: 13px; }

    .main { display: grid; grid-template-columns: 1fr 340px; gap: 1rem; }

    .panel { border: 1px solid var(--border); background: var(--surface); padding: 1rem; position: relative; }
    .panel::before { content: attr(data-title); position: absolute; top: -1px; left: 12px; background: var(--bg); padding: 0 6px; font-size: 10px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; }
    .panel-title-pad { margin-top: 0.75rem; }

    .rig-area { display: flex; flex-direction: column; gap: 1rem; }

    .btc-display { text-align: center; padding: 1.5rem; border: 1px solid var(--border); background: var(--surface2); position: relative; overflow: hidden; }
    .btc-display::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,255,65,0.05) 0%, transparent 70%); pointer-events: none; }
    .btc-label { font-size: 10px; letter-spacing: 3px; color: var(--text-faint); text-transform: uppercase; margin-bottom: 0.5rem; }
    .btc-amount { font-family: 'VT323', monospace; font-size: 52px; color: var(--yellow); text-shadow: 0 0 20px rgba(255,204,0,0.6); line-height: 1; letter-spacing: 2px; }
    .btc-usd { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
    .hashrate-display { font-size: 11px; color: var(--green-dim); margin-top: 8px; letter-spacing: 1px; }

    .mine-btn { width: 100%; padding: 1rem; background: var(--green-faint); border: 2px solid var(--green); color: var(--green); font-family: 'VT323', monospace; font-size: 28px; letter-spacing: 4px; cursor: pointer; text-transform: uppercase; transition: all 0.1s; box-shadow: 0 0 15px var(--green-glow); }
    .mine-btn:hover { background: rgba(0,255,65,0.12); box-shadow: 0 0 30px var(--green-glow), inset 0 0 20px rgba(0,255,65,0.08); text-shadow: 0 0 10px var(--green); }
    .mine-btn:active { transform: scale(0.98); }
    .mine-btn.cooling { border-color: var(--red); color: var(--red); background: rgba(255,51,51,0.05); box-shadow: 0 0 15px rgba(255,51,51,0.2); cursor: not-allowed; }

    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .stat-box { border: 1px solid var(--border); padding: 0.75rem; background: var(--surface2); text-align: center; }
    .stat-label { font-size: 9px; letter-spacing: 2px; color: var(--text-faint); text-transform: uppercase; margin-bottom: 4px; }
    .stat-value { font-family: 'VT323', monospace; font-size: 22px; color: var(--green); }
    .stat-value.hot { color: var(--red); text-shadow: 0 0 8px rgba(255,51,51,0.5); }
    .stat-value.warm { color: var(--yellow); }

    .heat-bar-wrap { border: 1px solid var(--border); padding: 0.75rem; background: var(--surface2); }
    .heat-bar-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim); margin-bottom: 6px; letter-spacing: 1px; }
    .heat-bar-track { height: 8px; background: var(--green-faint); border: 1px solid var(--border); position: relative; overflow: hidden; }
    .heat-bar-fill { height: 100%; width: 0%; transition: width 0.3s, background 0.3s; background: var(--green); box-shadow: 0 0 6px currentColor; }

    .log-area { border: 1px solid var(--border); background: var(--surface2); padding: 0.5rem 0.75rem; height: 130px; overflow-y: auto; font-size: 11px; color: var(--text-dim); line-height: 1.6; }
    .log-area::-webkit-scrollbar { width: 4px; }
    .log-area::-webkit-scrollbar-thumb { background: var(--green-faint); }
    .log-line { animation: fadeIn 0.2s; }
    .log-line.good { color: var(--green); }
    .log-line.bad { color: var(--red); }
    .log-line.info { color: var(--blue); }
    .log-line.warn { color: var(--yellow); }
    @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

    /* SHOP */
    .shop-scroll { overflow-y: auto; max-height: calc(100vh - 160px); display: flex; flex-direction: column; gap: 0.5rem; padding-right: 2px; }
    .shop-scroll::-webkit-scrollbar { width: 4px; }
    .shop-scroll::-webkit-scrollbar-thumb { background: var(--green-faint); }

    .shop-item { border: 1px solid var(--border); background: var(--surface2); padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .shop-left { flex: 1; }
    .shop-name { font-family: 'VT323', monospace; font-size: 20px; color: var(--green); line-height: 1; }
    .shop-desc { font-size: 10px; color: var(--text-faint); margin-top: 2px; line-height: 1.4; }
    .shop-owned { font-size: 10px; color: var(--text-dim); margin-top: 4px; }

    .buy-btn { font-family: 'VT323', monospace; font-size: 18px; padding: 6px 14px; border: 1px solid var(--green); background: var(--green-faint); color: var(--green); cursor: pointer; white-space: nowrap; transition: all 0.15s; flex-shrink: 0; }
    .buy-btn:hover { background: rgba(0,255,65,0.15); box-shadow: 0 0 10px var(--green-glow); }
    .buy-btn:active { transform: scale(0.96); }
    .buy-btn.cant-afford { border-color: var(--text-faint); color: var(--text-faint); background: transparent; cursor: not-allowed; }
    .buy-btn.cant-afford:hover { box-shadow: none; background: transparent; }
    .price-text { font-size: 11px; display: block; text-align: center; margin-top: 2px; color: var(--yellow); }
    .price-text.red { color: var(--red); }

    .float-up { position: fixed; pointer-events: none; font-family: 'VT323', monospace; font-size: 18px; color: var(--yellow); text-shadow: 0 0 8px rgba(255,204,0,0.8); animation: floatUp 1s forwards; z-index: 500; }
    @keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-60px)} }

    .footer-bar { border: 1px solid var(--border); padding: 0.5rem 1rem; display: flex; justify-content: space-between; background: var(--surface); font-size: 10px; color: var(--text-faint); letter-spacing: 1px; }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50%{opacity:0} }
  </style>
</head>
<body>
<div class="shell">

  <header class="header">
    <div class="logo">CRYPTO<span>₿</span>MINER <span style="font-size:14px;color:var(--text-faint)">v0.4.2</span></div>
    <div class="header-stats">
      <div>NET WORTH<br><strong id="hdr-worth">$0.00</strong></div>
      <div>BLOCKS FOUND<br><strong id="hdr-blocks">0</strong></div>
      <div>UPTIME<br><strong id="hdr-uptime">00:00:00</strong></div>
    </div>
  </header>

  <div class="main">

    <div class="rig-area">
      <div class="btc-display">
        <div class="btc-label">// wallet balance</div>
        <div class="btc-amount" id="btc-display">0.00000000</div>
        <div class="btc-usd" id="usd-display">≈ $0.00 USD</div>
        <div class="hashrate-display" id="hashrate-display">hashrate: 1 H/s &nbsp;|&nbsp; per click: 0.00000010 ₿</div>
      </div>

      <button class="mine-btn" id="mine-btn" onclick="mine()">[ MINE BLOCK ]</button>

      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-label">Temperature</div>
          <div class="stat-value" id="temp-val">42°C</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Power Draw</div>
          <div class="stat-value" id="power-val">120W</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Efficiency</div>
          <div class="stat-value" id="eff-val">1.0x</div>
        </div>
      </div>

      <div class="heat-bar-wrap">
        <div class="heat-bar-label">
          <span>THERMAL LOAD</span>
          <span id="heat-pct">0%</span>
        </div>
        <div class="heat-bar-track">
          <div class="heat-bar-fill" id="heat-bar"></div>
        </div>
      </div>

      <div class="panel" data-title="// system log">
        <div class="panel-title-pad">
          <div class="log-area" id="log"></div>
        </div>
      </div>
    </div>

    <div class="panel" data-title="// shop">
      <div class="panel-title-pad">
        <div class="shop-scroll" id="shop"></div>
      </div>
    </div>

  </div>

  <div class="footer-bar">
    <span>SYS: NOMINAL <span class="blink">█</span></span>
    <span id="footer-passive">passive: 0.00000000 ₿/s</span>
    <span>NOT REAL MONEY.</span>
  </div>

</div>

<script>
const BTC_PRICE = 68420;

let btc = 0;
let heat = 0;
let blocks = 0;
let cooling = false;
let startTime = Date.now();
let lastTick = Date.now();

// Each item: bought = how many owned, flat effect per purchase
const ITEMS = [
  { id:'cpu',     icon:'🔲', name:'CPU OVERCLOCK',   desc:'+2 H/s per click. Runs a bit hot.',         cost:0.000005, clickHash:2,  passiveHash:0,    heatPerClick:1,  heatRegen:0,   power:10,   efficiency:0 },
  { id:'fan',     icon:'🌀', name:'CASE FANS',        desc:'Reduces heat buildup significantly.',        cost:0.00001,  clickHash:0,  passiveHash:0,    heatPerClick:-2, heatRegen:0,   power:5,    efficiency:0 },
  { id:'gpu',     icon:'🖥️', name:'GPU',              desc:'+30 H/s passive mining.',                   cost:0.00005,  clickHash:0,  passiveHash:30,   heatPerClick:0,  heatRegen:1,   power:80,   efficiency:0 },
  { id:'cooling', icon:'❄️', name:'LIQUID COOLING',   desc:'Big heat reduction. Worth it.',              cost:0.0001,   clickHash:0,  passiveHash:0,    heatPerClick:-4, heatRegen:-2,  power:20,   efficiency:0 },
  { id:'psu',     icon:'🔋', name:'BETTER PSU',       desc:'+15% efficiency on all mining.',             cost:0.0002,   clickHash:0,  passiveHash:0,    heatPerClick:0,  heatRegen:0,   power:0,    efficiency:0.15 },
  { id:'asic',    icon:'⚡', name:'ASIC MINER',       desc:'+400 H/s passive. The real deal.',           cost:0.0008,   clickHash:0,  passiveHash:400,  heatPerClick:0,  heatRegen:4,   power:300,  efficiency:0 },
  { id:'farm',    icon:'🏭', name:'MINING FARM',      desc:'+3000 H/s passive. You made it.',            cost:0.005,    clickHash:0,  passiveHash:3000, heatPerClick:0,  heatRegen:10,  power:2000, efficiency:0 },
  { id:'quantum', icon:'🔬', name:'QUANTUM RIG',      desc:'+40000 H/s. Probably illegal.',              cost:0.04,     clickHash:0,  passiveHash:40000,heatPerClick:0,  heatRegen:25,  power:9999, efficiency:0 },
];

// track how many of each bought
const owned = {};
ITEMS.forEach(i => owned[i.id] = 0);

function getStats() {
  let s = { clickHash:1, passiveHash:0, heatPerClick:5, heatRegen:0, power:120, efficiency:1.0, heatDecayBonus:0 };
  ITEMS.forEach(item => {
    const n = owned[item.id];
    if (n === 0) return;
    s.clickHash     += item.clickHash * n;
    s.passiveHash   += item.passiveHash * n;
    s.heatPerClick  += item.heatPerClick * n;
    s.heatRegen     += item.heatRegen * n;
    s.power         += item.power * n;
    s.efficiency    += item.efficiency * n;
  });
  s.heatPerClick = Math.max(1, s.heatPerClick);
  return s;
}

function itemCost(item) {
  // price scales with how many you own
  return item.cost * Math.pow(1.15, owned[item.id]);
}

function mine() {
  if (cooling) return;
  const s = getStats();
  heat = Math.min(100, heat + s.heatPerClick);
  const earned = s.clickHash * 0.0000001 * s.efficiency;
  btc += earned;
  blocks++;
  floatText('+' + earned.toFixed(8) + ' ₿');
  log('Block mined. +' + earned.toFixed(8) + ' ₿  [' + s.clickHash + ' H]', 'good');
  if (heat >= 100) triggerOverheat();
  updateUI();
}

function triggerOverheat() {
  cooling = true;
  const btn = document.getElementById('mine-btn');
  btn.textContent = '[ OVERHEATING — COOLING DOWN ]';
  btn.classList.add('cooling');
  log('⚠ THERMAL SHUTDOWN. Cooling required.', 'bad');
  const penalty = btc * 0.01;
  btc = Math.max(0, btc - penalty);
  if (penalty > 0.000000001) log('Thermal damage: -' + penalty.toFixed(8) + ' ₿', 'bad');
}

function buyItem(id) {
  const item = ITEMS.find(i => i.id === id);
  if (!item) return;
  const cost = itemCost(item);
  if (btc < cost) { log('Insufficient funds for ' + item.name + '.', 'bad'); return; }
  btc -= cost;
  owned[id]++;
  log('Purchased: ' + item.icon + ' ' + item.name + ' (x' + owned[id] + ')', 'info');
  renderShop();
  updateUI();
}

function renderShop() {
  const shop = document.getElementById('shop');
  shop.innerHTML = '';
  ITEMS.forEach(item => {
    const cost = itemCost(item);
    const canAfford = btc >= cost;

    const div = document.createElement('div');
    div.className = 'shop-item';
    div.innerHTML = `
      <div class="shop-left">
        <div class="shop-name">${item.icon} ${item.name}</div>
        <div class="shop-desc">${item.desc}</div>
        <div class="shop-owned">owned: ${owned[item.id]}</div>
      </div>
      <div style="text-align:center">
        <button class="buy-btn ${canAfford ? '' : 'cant-afford'}" onclick="buyItem('${item.id}')">BUY</button>
        <span class="price-text ${canAfford ? '' : 'red'}">₿ ${cost.toFixed(6)}</span>
      </div>
    `;
    shop.appendChild(div);
  });
}

function log(msg, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.className = 'log-line ' + (cls || '');
  const now = new Date();
  const ts = '[' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0') + ']';
  line.innerHTML = '<span style="color:var(--text-faint)">' + ts + '</span> ' + msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function floatText(text) {
  const btn = document.getElementById('mine-btn');
  const r = btn.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'float-up';
  el.textContent = text;
  el.style.left = (r.left + r.width / 2 - 60) + 'px';
  el.style.top = (r.top - 10 + window.scrollY) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function updateUI() {
  const s = getStats();
  document.getElementById('btc-display').textContent = btc.toFixed(8);
  document.getElementById('usd-display').textContent = '≈ $' + (btc * BTC_PRICE).toFixed(2) + ' USD';
  document.getElementById('hashrate-display').textContent =
    'hashrate: ' + (s.passiveHash + s.clickHash).toLocaleString() + ' H/s  |  per click: ' + (s.clickHash * 0.0000001).toFixed(8) + ' ₿';

  const heatPct = heat.toFixed(0);
  document.getElementById('heat-pct').textContent = heatPct + '%';
  const bar = document.getElementById('heat-bar');
  bar.style.width = heatPct + '%';
  bar.style.background = heat > 80 ? 'var(--red)' : heat > 50 ? 'var(--yellow)' : 'var(--green)';

  const temp = 42 + heat * 0.7;
  const tempEl = document.getElementById('temp-val');
  tempEl.textContent = temp.toFixed(0) + '°C';
  tempEl.className = 'stat-value' + (temp > 90 ? ' hot' : temp > 70 ? ' warm' : '');

  document.getElementById('power-val').textContent = s.power + 'W';
  document.getElementById('eff-val').textContent = s.efficiency.toFixed(2) + 'x';
  document.getElementById('hdr-worth').textContent = '$' + (btc * BTC_PRICE).toFixed(2);
  document.getElementById('hdr-blocks').textContent = blocks.toLocaleString();
  document.getElementById('footer-passive').textContent =
    'passive: ' + (s.passiveHash * 0.0000001 * s.efficiency).toFixed(8) + ' ₿/s';

  // refresh buy button affordability
  document.querySelectorAll('.buy-btn').forEach((btn, i) => {
    const item = ITEMS[i];
    if (!item) return;
    const cost = itemCost(item);
    const can = btc >= cost;
    btn.className = 'buy-btn' + (can ? '' : ' cant-afford');
    const priceEl = btn.nextElementSibling;
    if (priceEl) {
      priceEl.textContent = '₿ ' + cost.toFixed(6);
      priceEl.className = 'price-text' + (can ? '' : ' red');
    }
  });
}

function gameTick() {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  const s = getStats();

  if (!cooling && s.passiveHash > 0) {
    const earned = s.passiveHash * 0.0000001 * s.efficiency * dt;
    btc += earned;
    if (Math.random() < 0.01) log('Auto-mined: +' + (earned * 60).toFixed(8) + ' ₿/min', 'good');
  }

  if (heat > 0) {
    const decay = (1 + s.heatRegen * 0.1) * dt * (cooling ? 5 : 1);
    heat = Math.max(0, heat - decay);
  }

  if (cooling && heat <= 10) {
    cooling = false;
    const btn = document.getElementById('mine-btn');
    btn.textContent = '[ MINE BLOCK ]';
    btn.classList.remove('cooling');
    log('System cooled. Mining resumed.', 'info');
  }

  const elapsed = Math.floor((now - startTime) / 1000);
  const h = String(Math.floor(elapsed / 3600)).padStart(2,'0');
  const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2,'0');
  const sec = String(elapsed % 60).padStart(2,'0');
  document.getElementById('hdr-uptime').textContent = h + ':' + m + ':' + sec;

  updateUI();
  requestAnimationFrame(gameTick);
}

// boot
const BOOT = [
  ['Initializing mining daemon...', ''],
  ['Checking wallet integrity... OK', 'good'],
  ['Connecting to pool: mine.cryptopool.io:3333', ''],
  ['Pool connection established.', 'good'],
  ['GPU detected: RTX 3070 (fake)', 'info'],
  ['Ready. Click [MINE BLOCK] to begin.', 'warn'],
];
let bi = 0;
function boot() {
  if (bi < BOOT.length) { log(BOOT[bi][0], BOOT[bi][1]); bi++; setTimeout(boot, 280 + Math.random()*180); }
}

renderShop();
boot();
requestAnimationFrame(gameTick);
</script>
</body>
</html>
